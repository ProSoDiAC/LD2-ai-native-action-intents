name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: XAIR_Runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Unit and integration tests
        run: pytest -q
      - name: Committed results match the SHA-256 manifest
        run: python experiments/write_results_manifest.py --check --committed-only
      - name: Static check (pyflakes)
        run: pip install pyflakes && python -m pyflakes xair experiments tests ../scripts

  live-smoke:
    # Starts XAIR + adapter over HTTP only (no ROS) and runs the EXECUTE/REVOKE smoke test.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: XAIR_Runtime
        run: pip install -e ".[dev]"
      - name: Start stack
        run: ./scripts/start_full_stack.sh
      - name: Verify EXECUTE on RUN / REVOKE on PAUSED
        run: ./scripts/verify_e2e.sh
      - name: Stop stack
        if: always()
        run: ./scripts/stop_full_stack.sh
